[package]
name = "sapphire-agent-factory"
version = "0.1.3"
edition = "2024"

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.4"
chrono = { version = "0.4.44", features = ["clock", "serde"] }
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
pulldown-cmark = "0.13.1"
regex = "1.12.3"
ratatui = { version = "0.29.0", features = ["crossterm"] }
zstd = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
supports-color = "3.0.2"
thiserror = "2.0.17"
tokio = { version = "1.51.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.0"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
