[package]
name = "tori-integrations"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
open = "5"
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.13", features = ["form", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
